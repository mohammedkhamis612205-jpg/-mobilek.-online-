<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobileK Online - متجر الهواتف الذكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- شريط التنقل العلوي -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2 space-x-reverse">
                <i class="fa-solid fa-mobile-screen-button text-2xl text-yellow-300"></i>
                <span class="text-xl font-bold tracking-wide">MobileK Online</span>
            </div>
            <div class="flex items-center space-x-3 space-x-reverse">
                <button onclick="toggleAdminModal()" class="bg-blue-800 hover:bg-blue-900 px-3 py-2 rounded-lg text-sm font-semibold flex items-center gap-1 transition">
                    <i class="fa-solid fa-gear"></i> لوحة التحكم
                </button>
                <button onclick="toggleCart()" class="relative bg-blue-700 hover:bg-blue-800 px-4 py-2 rounded-lg flex items-center space-x-2 space-x-reverse transition">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>السلة</span>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto px-4 py-8 flex-grow">
        <!-- قسم الترحيب -->
        <div class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white rounded-2xl p-8 mb-8 text-center shadow-lg">
            <h1 class="text-3xl md:text-4xl font-black mb-3">أهلاً بك في عالم الهواتف الذكية 📱</h1>
            <p class="text-blue-100 text-lg max-w-2xl mx-auto">اكتشف أحدث الهواتف الأصلية بأفضل الأسعار مع ضمان حقيقي وخدمة توصيل سريعة.</p>
        </div>

        <!-- قسم الفلاتر والبحث -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div class="w-full md:w-1/3">
                <input type="text" id="search-input" placeholder="ابحث عن هاتفك المفضل..." oninput="filterProducts()" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
            </div>
            <div class="flex flex-wrap gap-2 justify-center w-full md:w-auto">
                <button onclick="filterCategory('all')" class="cat-btn bg-blue-600 text-white px-4 py-2 rounded-xl font-semibold shadow transition">الكل</button>
                <button onclick="filterCategory('Apple')" class="cat-btn bg-white text-gray-700 hover:bg-gray-100 px-4 py-2 rounded-xl font-semibold shadow transition">آبل (Apple)</button>
                <button onclick="filterCategory('Samsung')" class="cat-btn bg-white text-gray-700 hover:bg-gray-100 px-4 py-2 rounded-xl font-semibold shadow transition">سامسونج (Samsung)</button>
                <button onclick="filterCategory('Xiaomi')" class="cat-btn bg-white text-gray-700 hover:bg-gray-100 px-4 py-2 rounded-xl font-semibold shadow transition">شاومي (Xiaomi)</button>
            </div>
        </div>

        <!-- شبكة المنتجات -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- المنتجات ستُضاف ديناميكياً هنا -->
        </div>
    </main>

    <!-- نافذة لوحة التحكم (لإضافة وتعديل المنتجات) -->
    <div id="admin-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
            <div class="bg-blue-600 text-white px-6 py-4 flex justify-between items-center">
                <h2 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-gear"></i> لوحة تحكم المتجر</h2>
                <button onclick="toggleAdminModal()" class="text-white hover:text-gray-200 text-2xl font-bold">&times;</button>
            </div>
            
            <div class="p-6 overflow-y-auto space-y-6">
                <!-- نموذج إضافة هاتف جديد -->
                <div class="bg-gray-50 p-4 rounded-xl border">
                    <h3 class="font-bold text-lg text-gray-800 mb-3">➕ إضافة هاتف جديد للمتجر</h3>
                    <form id="add-product-form" onsubmit="addNewProduct(event)" class="space-y-3">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <input type="text" id="new-name" placeholder="اسم الهاتف (مثال: آيفون 16 Pro)" required class="px-3 py-2 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                            <input type="number" id="new-price" placeholder="السعر (ج.م)" required class="px-3 py-2 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <select id="new-brand" class="px-3 py-2 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                                <option value="Apple">آبل (Apple)</option>
                                <option value="Samsung">سامسونج (Samsung)</option>
                                <option value="Xiaomi">شاومي (Xiaomi)</option>
                            </select>
                            <input type="url" id="new-image" placeholder="رابط صورة الهاتف (URL)" required class="px-3 py-2 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-bold text-sm transition">إضافة الهاتف للمتجر</button>
                    </form>
                </div>

                <!-- قائمة المنتجات الحالية للتعديل أو الحذف -->
                <div>
                    <h3 class="font-bold text-lg text-gray-800 mb-3">📦 إدارة المنتجات الحالية (تعديل الأسعار / الحذف)</h3>
                    <div id="admin-products-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                        <!-- المنتجات ستظهر هنا للتعديل -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة سلة التسوق الجانبية -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col p-6 overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-4 mb-4">
                <h2 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-cart-shopping text-blue-600"></i> سلة الشراء</h2>
                <button onclick="toggleCart()" class="text-gray-500 hover:text-red-500 text-xl font-bold">&times;</button>
            </div>
            <div id="cart-items" class="flex-grow space-y-4 overflow-y-auto">
                <!-- عناصر السلة -->
            </div>
            <div class="border-t pt-4 mt-4">
                <div class="flex justify-between text-lg font-bold mb-4">
                    <span>الإجمالي الكلي:</span>
                    <span id="cart-total" class="text-blue-600">0 ج.م</span>
                </div>
                <button onclick="checkout()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold shadow transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-bag-shopping"></i> إتمام الشراء الآن
                </button>
            </div>
        </div>
    </div>

    <!-- التذييل -->
    <footer class="bg-gray-900 text-white py-6 text-center mt-auto">
        <p class="text-gray-400 text-sm">جميع الحقوق محفوظة &copy; 2026 - MobileK Online</p>
    </footer>

    <!-- جافاسكريبت المتجر -->
    <script>
        // المنتجات الافتراضية أو المحفوظة مسبقاً
        let defaultProducts = [
            { id: 1, name: "آبل آيفون 15 برو ماكس", brand: "Apple", price: 55000, image: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=500", rating: 4.9 },
            { id: 2, name: "سامسونج جالاكسي S24 ألترا", brand: "Samsung", price: 52000, image: "https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=500", rating: 4.8 },
            { id: 3, name: "شاومي 14 برو", brand: "Xiaomi", price: 34000, image: "https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=500", rating: 4.7 },
            { id: 4, name: "آبل آيفون 14", brand: "Apple", price: 38000, image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500", rating: 4.6 },
            { id: 5, name: "سامسونج جالاكسي A55", brand: "Samsung", price: 18000, image: "https://images.unsplash.com/photo-1580910051074-3eb694886505?w=500", rating: 4.5 },
            { id: 6, name: "شاومي ريدمي نوت 13 برو", brand: "Xiaomi", price: 14000, image: "https://images.unsplash.com/photo-1565849904461-04a58ad377e0?w=500", rating: 4.4 }
        ];

        // استرجاع المنتجات من ذاكرة المتصفح أو استخدام الافتراضية
        let products = JSON.parse(localStorage.getItem('mobilek_products')) || defaultProducts;
        let cart = [];
        let currentCategory = 'all';

        function saveProductsToStorage() {
            localStorage.setItem('mobilek_products', JSON.stringify(products));
        }

        function displayProducts(productsToDisplay) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            if(productsToDisplay.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-12">لا توجد هواتف مطابقة للبحث</p>`;
                return;
            }
            productsToDisplay.forEach(product => {
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-gray-100 flex flex-col justify-between transition hover:shadow-xl">
                        <div class="relative h-56 bg-gray-100 overflow-hidden">
                            <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover transition hover:scale-105">
                            <span class="absolute top-3 right-3 bg-blue-600 text-white text-xs px-3 py-1 rounded-full font-semibold shadow">${product.brand}</span>
                        </div>
                        <div class="p-5 flex flex-col flex-grow">
                            <div class="flex items-center text-yellow-500 text-sm mb-2">
                                <i class="fa-solid fa-star"></i>
                                <span class="text-gray-600 font-bold mr-1">${product.rating || 4.5}</span>
                            </div>
                            <h3 class="text-lg font-bold text-gray-800 mb-2">${product.name}</h3>
                            <div class="mt-auto flex items-center justify-between pt-4 border-t">
                                <span class="text-xl font-black text-blue-600">${Number(product.price).toLocaleString()} ج.م</span>
                                <button onclick="addToCart(${product.id})" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow transition flex items-center gap-2">
                                    <i class="fa-solid fa-cart-plus"></i> إضافة
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-white', 'text-gray-700');
            });
            event.target.classList.remove('bg-white', 'text-gray-700');
            event.target.classList.add('bg-blue-600', 'text-white');
            
            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = products.filter(p => {
                const matchesCategory = currentCategory === 'all' || p.brand === currentCategory;
                const matchesSearch = p.name.toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });
            displayProducts(filtered);
        }

        // إبدارة لوحة التحكم
        function toggleAdminModal() {
            const modal = document.getElementById('admin-modal');
            modal.classList.toggle('hidden');
            if(!modal.classList.contains('hidden')) {
                renderAdminProductsList();
            }
        }

        function renderAdminProductsList() {
            const list = document.getElementById('admin-products-list');
            list.innerHTML = '';
            products.forEach(p => {
                list.innerHTML += `
                    <div class="flex items-center justify-between bg-white p-3 rounded-lg border shadow-sm gap-2">
                        <div class="flex-grow">
                            <h4 class="font-bold text-sm text-gray-800">${p.name}</h4>
                            <span class="text-xs text-gray-500">${p.brand}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="number" id="price-${p.id}" value="${p.price}" class="w-24 px-2 py-1 text-sm border rounded text-center font-bold text-blue-600">
                            <button onclick="updatePrice(${p.id})" class="bg-green-600 hover:bg-green-700 text-white px-2.5 py-1 rounded text-xs font-semibold">تعديل</button>
                            <button onclick="deleteProduct(${p.id})" class="bg-red-500 hover:bg-red-600 text-white px-2.5 py-1 rounded text-xs font-semibold">حذف</button>
                        </div>
                    </div>
                `;
            });
        }

        function addNewProduct(e) {
            e.preventDefault();
            const name = document.getElementById('new-name').value;
            const price = Number(document.getElementById('new-price').value);
            const brand = document.getElementById('new-brand').value;
            const image = document.getElementById('new-image').value;

            const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
            products.push({ id: newId, name, price, brand, image, rating: 5.0 });
            
            saveProductsToStorage();
            displayProducts(products);
            renderAdminProductsList();
            document.getElementById('add-product-form').reset();
            
            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'success',
                title: 'تم إضافة الهاتف بنجاح!',
                showConfirmButton: false,
                timer: 1500
            });
        }

        function updatePrice(id) {
            const newPrice = Number(document.getElementById(`price-${id}`).value);
            const product = products.find(p => p.id === id);
            if(product) {
                product.price = newPrice;
                saveProductsToStorage();
                displayProducts(products);
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'success',
                    title: 'تم تحديث السعر بنجاح!',
                    showConfirmButton: false,
                    timer: 1500
                });
            }
        }

        function deleteProduct(id) {
            Swal.fire({
                title: 'هل أنت متأكد من الحذف؟',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'نعم، احذف',
                cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    products = products.filter(p => p.id !== id);
                    saveProductsToStorage();
                    displayProducts(products);
                    renderAdminProductsList();
                    Swal.fire('تم الحذف!', '', 'success');
                }
            });
        }

        // سلة الشراء
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'success',
                title: 'تمت إضافة الهاتف إلى السلة',
                showConfirmButton: false,
                timer: 1500
            });
        }

        function updateCartUI() {
            const cartCount = document.getElementById('cart-count');
            const cartItems = document.getElementById('cart-items');
            const cartTotal = document.getElementById('cart-total');

            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.textContent = totalCount;

            if (cart.length === 0) {
                cartItems.innerHTML = `<p class="text-center text-gray-400 py-10">السلة فارغة حالياً</p>`;
                cartTotal.textContent = `0 ج.م`;
                return;
            }

            cartItems.innerHTML = '';
            let totalSum = 0;

            cart.forEach(item => {
                totalSum += item.price * item.quantity;
                cartItems.innerHTML += `
                    <div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl border">
                        <div>
                            <h4 class="font-bold text-sm text-gray-800">${item.name}</h4>
                            <p class="text-xs text-blue-600 font-semibold">${item.price.toLocaleString()} ج.م × ${item.quantity}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQty(${item.id}, 1)" class="bg-gray-200 hover:bg-gray-300 w-7 h-7 rounded-lg font-bold flex items-center justify-center">+</button>
                            <button onclick="changeQty(${item.id}, -1)" class="bg-gray-200 hover:bg-gray-300 w-7 h-7 rounded-lg font-bold flex items-center justify-center">-</button>
                        </div>
                    </div>
                `;
            });

            cartTotal.textContent = totalSum.toLocaleString() + ` ج.م`;
        }

        function changeQty(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
                updateCartUI();
            }
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
        }

        function checkout() {
            if (cart.length === 0) {
                Swal.fire('تنبيه', 'السلة فارغة، أضف منتجات أولاً!', 'warning');
                return;
            }
            Swal.fire({
                title: 'تم إرسال طلبك بنجاح! 🎉',
                text: 'شكراً لتسوقك معنا في MobileK Online، سنتواصل معك قريباً لتأكيد الشحن.',
                icon: 'success',
                confirmButtonText: 'حسناً'
            });
            cart = [];
            updateCartUI();
            toggleCart();
        }

        // عرض المنتجات عند التحميل
        displayProducts(products);
    </script>
</body>
</html>
